name: Sync Etsy catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/London"

permissions:
  contents: write
  pages: write

concurrency:
  group: etsy-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public Etsy listing data
        env:
          ETSY_CREDENTIALS: ${{ secrets.LASAIR_STUDIOS_ETSY }}
        run: python scripts/sync_etsy.py

      - name: Check for catalogue changes
        id: catalogue
        shell: bash
        run: |
          if git diff --quiet -- etsy-products.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated catalogue
        if: steps.catalogue.outputs.changed == 'true'
        run: |
          git config user.name "Lasair Etsy Sync"
          git config user.email "actions@users.noreply.github.com"
          git add etsy-products.js
          git commit -m "Sync Etsy catalogue"
          git push

      - name: Request GitHub Pages rebuild
        if: steps.catalogue.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
